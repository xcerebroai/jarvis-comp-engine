name: CI

on:
  pull_request:
  push:
    branches: [main]

# No secrets are used or required by this workflow.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Force deterministic mock mode; CI never needs real provider keys.
      JARVIS_USE_MOCK_PROVIDER: "true"
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        # Run the test script only if it is defined in package.json.
        run: |
          if npm run | grep -qE '^\s*test$'; then
            npm test
          else
            echo "No test script defined — skipping."
          fi

      - name: Build
        run: npm run build
